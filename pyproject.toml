[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrdbench"
version = "0.1.0"
description = "A model-agnostic benchmark protocol for XRD identification and refinement"
requires-python = ">=3.9"
dependencies = ["ase>=3.22", "h5py>=3.8", "numpy>=1.22", "pymatgen>=2023.1", "xrdinspector>=0.1.0"]

[project.scripts]
xrdbench = "xrdbench.cli:main"
xrdbench-prepare = "xrdbench.prepare:main"

[tool.setuptools.packages.find]
include = ["xrdbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["XRDinspector"]
